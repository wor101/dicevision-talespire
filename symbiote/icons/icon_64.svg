<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="#5865f2"/>

  <!-- D20 shape (icosahedron face) -->
  <polygon
    points="32,8 52,24 48,48 16,48 12,24"
    fill="none"
    stroke="#fff"
    stroke-width="2"
    stroke-linejoin="round"
  />

  <!-- Inner lines -->
  <line x1="32" y1="8" x2="32" y2="36" stroke="#fff" stroke-width="1.5"/>
  <line x1="12" y1="24" x2="32" y2="36" stroke="#fff" stroke-width="1.5"/>
  <line x1="52" y1="24" x2="32" y2="36" stroke="#fff" stroke-width="1.5"/>

  <!-- Camera lens indicator -->
  <circle cx="32" cy="50" r="6" fill="#fff" opacity="0.9"/>
  <circle cx="32" cy="50" r="3" fill="#5865f2"/>
</svg>
