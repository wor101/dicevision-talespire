<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DiceVision</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <h1>DiceVision</h1>
      <div id="status-indicator" class="status disconnected">
        <span class="status-dot"></span>
        <span id="status-text">Disconnected</span>
      </div>
    </header>

    <!-- Connection Panel -->
    <section class="panel" id="connection-panel">
      <h2>Session Code</h2>
      <div class="input-group">
        <input
          type="text"
          id="session-code"
          placeholder="XKRM-4N7B"
          maxlength="9"
          autocomplete="off"
          spellcheck="false"
        >
        <button id="connect-btn" class="btn btn-primary">Connect</button>
      </div>
      <p class="help-text">Enter the session code from DiceVision Settings</p>
    </section>

    <!-- Roll Mode Panel (hidden until connected) -->
    <section class="panel" id="mode-panel" style="display: none;">
      <h2>Roll Mode</h2>

      <div class="mode-row">
        <label class="toggle-label">
          <span>Continuous Mode</span>
          <div class="toggle-switch">
            <input type="checkbox" id="continuous-mode">
            <span class="toggle-slider"></span>
          </div>
        </label>
      </div>

      <div class="mode-row">
        <button id="roll-once-btn" class="btn btn-primary" disabled>
          Roll Once
        </button>
      </div>

      <div class="waiting-status">
        <span class="waiting-dot" id="waiting-dot"></span>
        <span id="waiting-text">Not waiting for rolls</span>
      </div>
    </section>

    <!-- Options Panel (hidden until connected) -->
    <section class="panel" id="options-panel" style="display: none;">
      <h2>Options</h2>

      <div class="option-row">
        <label for="chat-announce">
          <input type="checkbox" id="chat-announce" checked>
          Announce in chat
        </label>
      </div>

      <div class="option-row">
        <label for="roll-target">Chat announcement to:</label>
        <select id="roll-target">
          <option value="board">Board (everyone)</option>
          <option value="gm">GM only</option>
        </select>
      </div>

      <div class="option-row">
        <label for="roll-name">Roll label:</label>
        <input type="text" id="roll-name" value="Physical Dice" placeholder="Physical Dice">
      </div>
    </section>

    <!-- Recent Rolls Panel (hidden until connected) -->
    <section class="panel" id="rolls-panel" style="display: none;">
      <h2>Recent Rolls</h2>
      <div id="rolls-list" class="rolls-list">
        <p class="empty-state">No rolls yet</p>
      </div>
    </section>

    <!-- Disconnect Button (hidden until connected) -->
    <div id="disconnect-container" style="display: none;">
      <button id="disconnect-btn" class="btn btn-secondary">Disconnect</button>
    </div>

    <!-- Error Display -->
    <div id="error-display" class="error-display" style="display: none;">
      <span id="error-message"></span>
      <button id="error-dismiss" class="btn-icon">&times;</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
