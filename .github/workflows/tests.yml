# Lint and test every PR and every push to main. The "lint" and "test" jobs
# are required checks in the main branch ruleset, so keep their names.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dev dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check manifest.json is valid JSON
        run: |
          node -e 'JSON.parse(require("fs").readFileSync("symbiote/manifest.json", "utf8"))' \
            || { echo "::error file=symbiote/manifest.json::invalid JSON"; exit 1; }

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Run unit tests
        run: npm test

      # The release workflow only runs on tags, so check its packaging here
      - name: Check the release zip builds
        run: |
          ./scripts-dev/build-zip.sh v0.0.0-ci
          unzip -l dist/DiceVision.zip | grep -q ' DiceVision/manifest.json$' \
            || { echo "::error::DiceVision/manifest.json missing from the zip"; exit 1; }
          if unzip -l dist/DiceVision.zip | grep -E ' DiceVision/(tests|scripts-dev|node_modules|\.github)/'; then
            echo "::error::dev files in the release zip"; exit 1
          fi
